<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Schulmanager Enhanced</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>Schulmanager Enhanced</h1>
  <p class="hint">
    Öffne Schulmanager Online – links steht jetzt eine feste Sidebar mit
    allen Modulen (per Ziehen sortierbar) und einem ⚙-Button für Theme,
    Akzentfarbe, Startseite und eigenes CSS.
  </p>
  <div class="quick-themes">
    <button data-theme="light">Hell</button>
    <button data-theme="dark">Dunkel</button>
    <button data-theme="nitro-purple">Nitro Purple</button>
    <button data-theme="nitro-aurora">Nitro Aurora</button>
    <button data-theme="nitro-sunset">Nitro Sunset</button>
  </div>
  <p class="hint small">Theme-Schnellwahl wirkt auf offene Schulmanager-Tabs.</p>
  <script src="popup.js"></script>
</body>
</html>
