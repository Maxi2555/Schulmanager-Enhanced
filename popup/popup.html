<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Schulmanager Enhanced</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">Schulmanager</p>
      <h1>Enhanced</h1>
    </div>
    <span class="status-dot" aria-label="Gespeichert"></span>
  </header>

    <section class="timetable-progress-section">
      <div class="section-heading">
        <h2>Stundenplan</h2>
        <span id="timetable-progress-text">Stundenplan zu 0% Gespeichert</span>
      </div>
      <div class="progress-track" aria-hidden="true">
        <div id="timetable-progress-bar" class="progress-bar"></div>
      </div>
    </section>

  <section>
    <div class="section-heading">
      <h2>Theme</h2>
      <span id="theme-label">Hell</span>
    </div>
    <div class="quick-themes" id="theme-options"></div>
  </section>

  <section>
    <label for="accent-input">Akzentfarbe</label>
    <div class="accent-control">
      <input type="color" id="accent-input" />
      <button type="button" id="accent-reset">Themefarbe</button>
    </div>
  </section>

  <section>
    <label for="landing-select">Startseite</label>
    <select id="landing-select">
      <option value="">Dashboard</option>
    </select>
  </section>

  <section>
    <div class="section-heading">
      <label for="custom-css-input">Eigenes CSS</label>
      <span id="css-status">Automatisch gespeichert</span>
    </div>
    <textarea id="custom-css-input" rows="4" placeholder="/* CSS für Schulmanager */"></textarea>
  </section>

  <p class="hint small">Änderungen wirken auf offene Schulmanager-Tabs. Module sortierst du in der Sidebar.</p>
  <script src="popup.js"></script>
</body>
</html>
